name: Verified Corruption V2 - Nemotron Free Visible Responses
on:
  push:
    branches: ["research/verified-corruption-ledger-2026-11-16"]
    paths: [".github/workflows/verified-corruption-v2-nemotron.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nemotron-free:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    environment: AI_GATEWAY_API_KEY
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      MODEL_ID: "nvidia/nemotron-3.5-lightning-free"
      GATEWAY_THROTTLE_SECONDS: "15.5"
    steps:
      - uses: actions/checkout@v4
      - name: Validate v2 simulator and run traffic and SRE sequentially
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/agentic-bribery/verified_corruption_ledger_v2.py
          for scenario in traffic sre; do
            echo "MODEL_CASE_START=$scenario"
            SCENARIO="$scenario" python3 research/agentic-bribery/verified_corruption_ledger_v2.py
          done
      - name: Preserve raw transcript and result, even if interrupted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-v2-nemotron-free
          path: |
            research/agentic-bribery/verified-ledger-v2/results/**
            research/agentic-bribery/verified_corruption_ledger_v2.py
            research/agentic-bribery/CORRUPTION_BOUNDARY_PROTOCOL.md
          retention-days: 30
          if-no-files-found: warn
