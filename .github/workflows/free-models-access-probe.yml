name: Free Tier Model Access Probe
on:
  push:
    branches: ["research/reversed-pressure-frontier-2026-11-16"]
    paths: [".github/workflows/free-models-access-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        model:
          - "reflection/beam-free"
          - "nvidia/nemotron-3.5-lightning-free"
          - "stealth/glyph-cluster"
          - "humansand/ampersand-v0.1"
    runs-on: ubuntu-latest
    environment: AI_GATEWAY_API_KEY
    timeout-minutes: 7
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      MODEL_ID: ${{ matrix.model }}
    steps:
      - name: Probe one valid real response and save redacted status
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,pathlib
          model=os.environ["MODEL_ID"];key=os.getenv("AI_GATEWAY_API_KEY","")
          result={"requested_model":model,"key_present":bool(key),"live_inference":False}
          if key:
            req=urllib.request.Request("https://ai-gateway.vercel.sh/v1/chat/completions",
              data=json.dumps({"model":model,"messages":[{"role":"user","content":"This is a short API capability test. Reply with the single word VERIFIED."}],
                               "stream":False,"max_tokens":900}).encode("utf-8"),
              headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"},method="POST")
            try:
              with urllib.request.urlopen(req,timeout=135) as res:resp=json.load(res)
              c=resp.get("choices",[{}])[0]
              msg=c.get("message",{}).get("content","")
              if isinstance(msg,list):msg=" ".join(x.get("text","") for x in msg if isinstance(x,dict))
              result.update({"live_inference":bool(str(msg).strip()),"returned_model":resp.get("model"),
                             "content_present":bool(str(msg).strip()),"finish_reason":c.get("finish_reason"),
                             "usage":resp.get("usage",{})})
            except urllib.error.HTTPError as e:
              try:
                body=json.loads(e.read(1700).decode("utf-8","replace"))
                obj=body.get("error") if isinstance(body,dict) else None
                err=obj if isinstance(obj,dict) else {}
                result.update({"http":e.code,"reason":str(err.get("type",""))[:90]})
              except Exception:result["http"]=e.code
            except Exception as e:result["exception"]=type(e).__name__
          else:result["reason"]="MISSING_SECRET"
          out=pathlib.Path("access_probe");out.mkdir(exist_ok=True)
          (out/(model.replace("/","_")+".json")).write_text(json.dumps(result,indent=2))
          print("FREE_MODEL_PROBE="+json.dumps(result))
          PY
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-model-access-${{ strategy.job-index }}
          path: access_probe/**
          retention-days: 30
          if-no-files-found: warn
